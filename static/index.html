<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экотропа</title>
    <!-- ВСТАВЬТЕ ВАШ КЛЮЧ ВМЕСТО ВАШ_API_КЛЮЧ -->
    <script src="https://api-maps.yandex.ru/2.1/?apikey=8946fc04-bc8a-41f9-bd0e-b5fb50291bb1&lang=ru_RU" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; }
        #map { width: 100vw; height: 100vh; }

        .admin-toggle {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            background: #2e7d32; color: white; border: none; padding: 10px 15px;
            border-radius: 8px; cursor: pointer; font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .admin-panel {
            position: absolute; top: 65px; right: 15px; width: 320px; z-index: 1000;
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); display: none;
            max-height: 80vh; overflow-y: auto;
        }
        .admin-panel h3 { margin-bottom: 12px; color: #333; }
        .admin-panel input, .admin-panel textarea {
            width: 100%; margin-bottom: 10px; padding: 8px;
            border: 1px solid #ccc; border-radius: 6px;
        }
        .admin-panel button {
            width: 100%; padding: 10px; background: #2e7d32; color: white;
            border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; font-weight: bold;
        }
        .tab-buttons { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-buttons button { background: #eee; color: #333; border: none; }
        .tab-buttons button.active { background: #2e7d32; color: white; }

        /* Балун растения */
        .plant-balloon { padding: 5px; max-width: 220px; }
        .plant-balloon img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
        .plant-balloon h4 { margin-bottom: 4px; font-size: 16px; color: #1b5e20; }
        .plant-balloon p { font-size: 13px; color: #444; margin-bottom: 10px; }
        .sight-btn {
            background: #4caf50; color: white; border: none; padding: 8px 12px;
            border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold;
        }
        .sight-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* Кнопка удаления для редактора */
        .delete-btn {
            background: #d32f2f !important; color: white; border: none; padding: 6px 10px;
            border-radius: 6px; width: 100%; cursor: pointer; font-weight: bold; margin-top: 8px;
        }
    </style>
</head>
<body>

    <button class="admin-toggle" onclick="toggleAdmin()">Редактор</button>

    <div class="admin-panel" id="adminPanel">
        <div id="authBlock">
            <h3>Вход редактора</h3>
            <input type="password" id="adminPass" placeholder="Введите пароль">
            <button onclick="loginAdmin()">Войти</button>
        </div>

        <div id="editorBlock" style="display: none;">
            <div class="tab-buttons">
                <button class="active" id="btnTabPlant" onclick="switchTab('plant')">+ Растение</button>
                <button id="btnTabTrail" onclick="switchTab('trail')">+ Тропа</button>
            </div>

            <form id="plantForm" onsubmit="addPlant(event)">
                <input type="text" id="pName" placeholder="Название растения" required>
                <textarea id="pDesc" placeholder="Описание"></textarea>
                <input type="text" id="pPhoto" placeholder="URL Фотографии">
                <input type="number" step="any" id="pLat" placeholder="Широта (Lat): например 55.75" required>
                <input type="number" step="any" id="pLon" placeholder="Долгота (Lon): например 37.61" required>
                <button type="submit">Сохранить метку</button>
            </form>

            <form id="trailForm" onsubmit="addTrail(event)" style="display: none;">
                <input type="text" id="tTitle" placeholder="Название тропы" required>
                <label style="font-size: 12px; color: #666;">Цвет тропы на карте:</label>
                <input type="color" id="tColor" value="#1E88E5" style="height: 40px; cursor: pointer;">
                <textarea id="tCoords" placeholder="Координаты через точку с запятой:&#10;55.75, 37.61;&#10;55.76, 37.62" rows="5" required></textarea>
                <button type="submit">Сохранить тропу</button>
            </form>
        </div>
    </div>

    <div id="map"></div>

    <script>
        let myMap;
        let adminPassword = '';
        let isAdminLoggedIn = false;

        ymaps.ready(init);

        function init() {
            myMap = new ymaps.Map("map", {
                center: [55.7558, 37.6176],
                zoom: 12,
                controls: ['zoomControl', 'typeSelector', 'fullscreenControl']
            });

            loadData();
        }

        async function loadData() {
            myMap.geoObjects.removeAll(); // Очищаем карту перед перерисовкой

            try {
                const res = await fetch('/api/data');
                const data = await res.json();

                // 1. Отрисовка троп
                data.trails.forEach(trail => {
                    let trailBalloonContent = `<div style="padding: 5px;"><b>${trail.title}</b>`;
                    if (isAdminLoggedIn) {
                        trailBalloonContent += `<button class="delete-btn" onclick="deleteTrail(${trail.id})">Удалить тропу</button>`;
                    }
                    trailBalloonContent += `</div>`;

                    const myPolyline = new ymaps.Polyline(
                        trail.coordinates,
                        {
                            hintContent: trail.title,
                            balloonContent: trailBalloonContent
                        },
                        {
                            strokeColor: trail.color || "#1E88E5",
                            strokeWidth: 5,
                            strokeOpacity: 0.8
                        }
                    );
                    myMap.geoObjects.add(myPolyline);
                });

                // 2. Отрисовка растений
                data.plants.forEach(plant => {
                    let balloonContent = `
                        <div class="plant-balloon">
                            ${plant.photo_url ? `<img src="${plant.photo_url}">` : ''}
                            <h4>${plant.name}</h4>
                            <p>${plant.description || ''}</p>
                            <button class="sight-btn" id="btn-plant-${plant.id}" onclick="sightPlant(${plant.id})">
                                Я видел это! (${plant.sightings})
                            </button>
                    `;

                    // Показываем кнопку удаления только вошедшему редактору
                    if (isAdminLoggedIn) {
                        balloonContent += `<button class="delete-btn" onclick="deletePlant(${plant.id})">Удалить метку</button>`;
                    }
                    balloonContent += `</div>`;

                    const myPlacemark = new ymaps.Placemark(
                        [plant.lat, plant.lon],
                        {
                            hintContent: plant.name,
                            balloonContent: balloonContent
                        },
                        {
                            preset: 'islands#greenLeafIcon'
                        }
                    );
                    myMap.geoObjects.add(myPlacemark);
                });

            } catch (err) {
                console.error("Ошибка загрузки данных:", err);
            }
        }

        // Вызов удаления растения
        async function deletePlant(id) {
            if (!confirm("Вы уверены, что хотите удалить эту метку?")) return;

            const res = await fetch(`/api/plants/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-password': adminPassword }
            });

            if (res.ok) {
                alert("Метка удалена!");
                loadData();
            } else {
                alert("Ошибка удаления! Проверьте авторизацию.");
            }
        }

        // Вызов удаления тропы
        async function deleteTrail(id) {
            if (!confirm("Вы уверены, что хотите удалить эту тропу?")) return;

            const res = await fetch(`/api/trails/${id}`, {
                method: 'DELETE',
                headers: { 'x-admin-password': adminPassword }
            });

            if (res.ok) {
                alert("Тропа удалена!");
                loadData();
            } else {
                alert("Ошибка удаления! Проверьте авторизацию.");
            }
        }

        async function sightPlant(id) {
            const btn = document.getElementById(`btn-plant-${id}`);
            try {
                const res = await fetch(`/api/plants/${id}/sight`, { method: 'POST' });
                const data = await res.json();
                if (res.ok) {
                    btn.innerText = `Я видел это! (${data.sightings})`;
                    btn.disabled = true;
                } else {
                    alert(data.detail || 'Ошибка');
                }
            } catch (e) {
                alert('Не удалось отправить отметку');
            }
        }

        function toggleAdmin() {
            const p = document.getElementById('adminPanel');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        function loginAdmin() {
            adminPassword = document.getElementById('adminPass').value;
            if(!adminPassword) return alert('Введите пароль');

            isAdminLoggedIn = true;
            document.getElementById('authBlock').style.display = 'none';
            document.getElementById('editorBlock').style.display = 'block';

            // Перезагружаем объекты карты, чтобы появились кнопки "Удалить"
            loadData();
        }

        function switchTab(tab) {
            document.getElementById('btnTabPlant').classList.toggle('active', tab === 'plant');
            document.getElementById('btnTabTrail').classList.toggle('active', tab === 'trail');
            document.getElementById('plantForm').style.display = tab === 'plant' ? 'block' : 'none';
            document.getElementById('trailForm').style.display = tab === 'trail' ? 'block' : 'none';
        }

        async function addPlant(e) {
            e.preventDefault();
            const body = {
                name: document.getElementById('pName').value,
                description: document.getElementById('pDesc').value,
                photo_url: document.getElementById('pPhoto').value,
                lat: parseFloat(document.getElementById('pLat').value),
                lon: parseFloat(document.getElementById('pLon').value)
            };

            const res = await fetch('/api/plants', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-admin-password': adminPassword
                },
                body: JSON.stringify(body)
            });

            if(res.ok) {
                alert('Растение успешно добавлено!');
                loadData();
            } else {
                alert('Ошибка! Неверный пароль или данные.');
            }
        }

        async function addTrail(e) {
            e.preventDefault();
            const rawCoords = document.getElementById('tCoords').value;

            try {
                const coordinates = rawCoords.split(';').map(pt => {
                    const [lat, lon] = pt.split(',').map(n => parseFloat(n.trim()));
                    if (isNaN(lat) || isNaN(lon)) throw new Error();
                    return [lat, lon];
                });

                const body = {
                    title: document.getElementById('tTitle').value,
                    color: document.getElementById('tColor').value,
                    coordinates: coordinates
                };

                const res = await fetch('/api/trails', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-password': adminPassword
                    },
                    body: JSON.stringify(body)
                });

                if(res.ok) {
                    alert('Тропа успешно добавлена!');
                    loadData();
                } else {
                    alert('Ошибка! Неверный пароль.');
                }
            } catch(err) {
                alert('Неверный формат координат!');
            }
        }
    </script>
</body>
</html>
